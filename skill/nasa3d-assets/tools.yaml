tools:
  - name: search_nasa3d_assets
    description: Search downloadable 3D files in the NASA 3D Resources repository.
    source_file: scripts/search_nasa3d_assets.py
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true
    group: nasa3d
    input_schema:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        extensions:
          type: array
          items:
            type: string
          default: ["glb", "gltf", "obj", "fbx", "stl", "blend"]
    output_schema:
      type: object

  - name: download_nasa3d_file
    description: Download one file and return a validated AssetDescriptor with NASA usage attribution.
    source_file: scripts/download_nasa3d_file.py
    execution: sync
    affinity: any
    timeout_hint_secs: 180
    enforce_thread_affinity: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: true
    group: nasa3d
    input_schema:
      type: object
      required: ["path", "output_dir"]
      properties:
        path:
          type: string
        output_dir:
          type: string
    output_schema:
      type: object
      required: [asset_descriptor]
      properties:
        asset_descriptor:
          type: object
          required: [asset_id, variants, attribution]
          properties:
            asset_id:
              type: string
            variants:
              type: array
              minItems: 1
              items:
                type: object
                required: [local_path, format]
            attribution:
              type: object
              required: [source_url, license_text]
